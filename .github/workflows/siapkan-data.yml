name: Siapkan data Al-Quran

# Berjalan otomatis bila skrip/workflow ini berubah, atau manual dari tab Actions.
# Mengunduh teks Tanzil dan arti per kata Quran.com untuk 30 juz (6236 ayat),
# lalu mengomit data/quran.json dan data/laporan-data.txt.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/siapkan-data.mjs
      - .github/workflows/siapkan-data.yml

permissions:
  contents: write

jobs:
  siapkan-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unduh dan gabungkan data
        run: node scripts/siapkan-data.mjs

      - name: Komit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quran.json data/laporan-data.txt
          if git diff --cached --quiet; then
            echo "Data tidak berubah."
          else
            git commit -m "Data 30 juz: teks Tanzil + arti per kata Quran.com"
            git push
          fi
