name: Bangun APK

# Membangun APK setiap kali kode aplikasi berubah, lalu menaruhnya di
# GitHub Releases dengan tag "terbaru" agar bisa diunduh langsung dari HP.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - data/quran.json
      - data/rukuk.json
      - android/**
      - index.html
      - package.json
      - package-lock.json
      - capacitor.config.json
      - vite.config.ts
      - .github/workflows/bangun-apk.yml

permissions:
  contents: write

concurrency:
  group: bangun-apk
  cancel-in-progress: true

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Pasang dependensi
        run: npm ci

      - name: Uji
        run: npm test

      - name: Bangun web
        run: npm run build

      - name: Salin ke proyek Android
        run: npx cap sync android

      # K-74: Google Play ditunda. APK GitHub tetap memakai kunci sementara di repositori agar
      # setiap APK baru bisa menimpa aplikasi yang sudah terpasang (id.dabamona.rabth).
      # Kunci unggah permanen (K-68) disimpan Firdaus untuk dipakai saat Play dilanjutkan.
      - name: Siapkan kunci tanda tangan
        run: |
          {
            echo "SAKUHATI_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/kunci-sementara.jks"
            echo "SAKUHATI_KEYSTORE_PASSWORD=rabthsementara"
            echo "SAKUHATI_KEY_PASSWORD=rabthsementara"
            echo "SAKUHATI_KEY_ALIAS=rabth"
          } >> "$GITHUB_ENV"

      - name: Bangun APK
        working-directory: android
        run: ./gradlew assembleGithubRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}

      - name: Terbitkan ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/github/release/app-github-release.apk saku-hati.apk
          # Dicoba hingga 3 kali: layanan Releases GitHub kadang gagal sesaat.
          for coba in 1 2 3; do
            gh release delete terbaru --yes --cleanup-tag || true
            sleep 5
            if gh release create terbaru saku-hati.apk \
              --target "$GITHUB_SHA" \
              --title "Saku Hati 0.1.${{ github.run_number }}" \
              --notes "APK terbaru dari commit ${GITHUB_SHA::7}. Unduh saku-hati.apk lalu pasang di HP." \
              --latest; then
              exit 0
            fi
            echo "Percobaan $coba gagal, diulang…"
            sleep 15
          done
          exit 1
