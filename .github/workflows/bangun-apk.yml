name: Bangun APK

# Membangun APK setiap kali kode aplikasi berubah, lalu menaruhnya di
# GitHub Releases dengan tag "terbaru" agar bisa diunduh langsung dari HP.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - data/quran.json
      - data/rukuk.json
      - android/**
      - index.html
      - package.json
      - package-lock.json
      - capacitor.config.json
      - vite.config.ts
      - .github/workflows/bangun-apk.yml

permissions:
  contents: write

concurrency:
  group: bangun-apk
  cancel-in-progress: true

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Pasang dependensi
        run: npm ci

      - name: Uji
        run: npm test

      - name: Bangun web
        run: npm run build

      - name: Salin ke proyek Android
        run: npx cap sync android

      # Kunci unggah permanen dari secret repositori (K-56, P-21). Tanpa kunci ini kode tetap dibangun
      # (untuk memeriksa), tetapi tidak diterbitkan: APK dengan kunci lain tidak bisa menimpa aplikasi terpasang.
      - name: Siapkan kunci tanda tangan
        env:
          KUNCI_BASE64: ${{ secrets.SAKUHATI_KEYSTORE_BASE64 }}
          KUNCI_SANDI: ${{ secrets.SAKUHATI_KEYSTORE_PASSWORD }}
          KUNCI_ALIAS: ${{ secrets.SAKUHATI_KEY_ALIAS }}
        run: |
          if [ -z "$KUNCI_BASE64" ] || [ -z "$KUNCI_SANDI" ] || [ -z "$KUNCI_ALIAS" ]; then
            echo "ADA_KUNCI=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "ADA_KUNCI=1" >> "$GITHUB_ENV"
          echo "$KUNCI_BASE64" | base64 -d > "$RUNNER_TEMP/sakuhati.jks"
          {
            echo "SAKUHATI_KEYSTORE_PATH=$RUNNER_TEMP/sakuhati.jks"
            echo "SAKUHATI_KEYSTORE_PASSWORD=$KUNCI_SANDI"
            echo "SAKUHATI_KEY_PASSWORD=$KUNCI_SANDI"
            echo "SAKUHATI_KEY_ALIAS=$KUNCI_ALIAS"
          } >> "$GITHUB_ENV"

      # APK lengkap untuk GitHub dan AAB tanpa Pengingat ayat untuk Google Play (K-56).
      - name: Bangun APK dan AAB
        working-directory: android
        run: ./gradlew assembleGithubRelease bundlePlayRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}

      - name: Kunci belum diisi
        if: env.ADA_KUNCI != '1'
        run: |
          echo "::error::Kode berhasil dibangun, tetapi tidak diterbitkan: secret SAKUHATI_KEYSTORE_BASE64, SAKUHATI_KEYSTORE_PASSWORD, dan SAKUHATI_KEY_ALIAS belum diisi di Settings > Secrets and variables > Actions."
          exit 1

      - name: Terbitkan ke GitHub Releases
        if: env.ADA_KUNCI == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/github/release/app-github-release.apk saku-hati.apk
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab saku-hati-play.aab
          gh release delete terbaru --yes --cleanup-tag || true
          gh release create terbaru saku-hati.apk \
            --target "$GITHUB_SHA" \
            --title "Saku Hati 0.1.${{ github.run_number }}" \
            --notes "APK terbaru dari commit ${GITHUB_SHA::7}. Unduh saku-hati.apk lalu pasang di HP." \
            --latest
          gh release delete play-terbaru --yes --cleanup-tag || true
          gh release create play-terbaru saku-hati-play.aab \
            --target "$GITHUB_SHA" \
            --title "Saku Hati untuk Google Play 0.1.${{ github.run_number }}" \
            --notes "Berkas AAB (tanpa Pengingat ayat) dari commit ${GITHUB_SHA::7}. Diunggah ke Play Console, bukan dipasang langsung di HP." \
            --prerelease
