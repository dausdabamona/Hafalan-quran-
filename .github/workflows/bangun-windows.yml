name: Bangun Windows

# Membangun penginstal Saku Hati untuk Windows (K-37) setiap kali kode aplikasi
# berubah, lalu menaruhnya di GitHub Releases dengan tag "windows-terbaru".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - data/quran.json
      - data/rukuk.json
      - desktop/**
      - aset/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - .github/workflows/bangun-windows.yml

permissions:
  contents: write

concurrency:
  group: bangun-windows
  cancel-in-progress: true

jobs:
  bangun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi aplikasi
        run: npm ci

      - name: Uji
        run: npm test

      - name: Bangun web
        run: npm run build

      - name: Siapkan berkas aplikasi Windows
        shell: bash
        run: |
          rm -rf desktop/app
          cp -r dist desktop/app
          cp aset/ikon-512.png desktop/app/ikon.png
          cp aset/ikon-512.png desktop/ikon.png
          cd desktop
          npm pkg set version="0.1.${{ github.run_number }}"

      - name: Pasang Electron
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # Unduhan alat electron-builder (NSIS, winCodeSign) dari GitHub kadang gagal sesaat (502/504):
      # disimpan di cache dan dicoba ulang sampai 3 kali.
      - name: Cache unduhan electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron-builder\Cache
            ~\AppData\Local\electron\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-builder-${{ runner.os }}-

      - name: Bangun penginstal
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for i in 1 2 3; do
            npm run bangun && exit 0
            echo "Percobaan $i gagal, ulang 30 detik lagi…"
            sleep 30
          done
          exit 1

      - name: Kemas ekstensi Claude (K-95)
        shell: bash
        run: |
          rm -rf bangun-mcpb
          mkdir -p bangun-mcpb/server
          cp desktop/ekstensi/manifest.json bangun-mcpb/
          cp desktop/mcp.js bangun-mcpb/server/
          cp aset/ikon-512.png bangun-mcpb/icon.png
          node -e "const fs=require('fs'),f='bangun-mcpb/manifest.json',m=JSON.parse(fs.readFileSync(f,'utf8'));m.version='0.1.${{ github.run_number }}';fs.writeFileSync(f,JSON.stringify(m,null,2))"
          npx --yes @anthropic-ai/mcpb@2.1.2 validate bangun-mcpb/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack bangun-mcpb desktop/keluaran/saku-hati.mcpb

      - name: Terbitkan ke GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-terbaru --yes --cleanup-tag || true
          gh release create windows-terbaru desktop/keluaran/saku-hati-setup.exe desktop/keluaran/saku-hati.mcpb \
            --target "$GITHUB_SHA" \
            --title "Saku Hati Windows 0.1.${{ github.run_number }}" \
            --notes "Penginstal Windows dari commit ${GITHUB_SHA::7}. Unduh saku-hati-setup.exe lalu jalankan. Bila muncul 'Windows protected your PC', klik More info → Run anyway. Ekstensi Claude: unduh saku-hati.mcpb lalu klik dua kali → Install di Claude desktop." \
            --latest=false
